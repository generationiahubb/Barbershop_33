<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estamos abertos? | Barbershop 33</title>
<meta name="description" content="Veja em tempo real se a Barbershop 33 está aberta agora antes de sair de casa.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="brand"><img src="logo.png" alt="Barbershop 33" class="logo-img">BARBERSHOP 33</div>

<div class="card status-card" id="statusCard">
  <span class="status-dot"></span>
  <p class="status-label" id="statusLabel">Carregando...</p>
  <p class="status-message" id="statusMessage"></p>
  <p class="status-updated" id="statusUpdated"></p>

  <a class="whatsapp-btn" id="whatsappBtn" href="https://wa.me/5514997135800" target="_blank">Falar no WhatsApp</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>
<script>
  const card = document.getElementById("statusCard");
  const label = document.getElementById("statusLabel");
  const message = document.getElementById("statusMessage");
  const updated = document.getElementById("statusUpdated");

  function formatRelative(date) {
    const diffMs = Date.now() - date.getTime();
    const diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return "agora mesmo";
    if (diffMin === 1) return "há 1 minuto";
    if (diffMin < 60) return `há ${diffMin} minutos`;
    const diffH = Math.floor(diffMin / 60);
    if (diffH === 1) return "há 1 hora";
    if (diffH < 24) return `há ${diffH} horas`;
    return date.toLocaleString("pt-BR");
  }

  let lastUpdatedDate = null;

  function render(data) {
    const aberto = !!data.aberto;
    card.classList.toggle("aberto", aberto);
    card.classList.toggle("fechado", !aberto);
    label.textContent = aberto ? "ABERTO AGORA" : "FECHADO NO MOMENTO";
    message.textContent = data.mensagem || "";
    lastUpdatedDate = data.atualizadoEm ? data.atualizadoEm.toDate() : null;
    tickUpdated();
  }

  function tickUpdated() {
    updated.textContent = lastUpdatedDate
      ? "Atualizado " + formatRelative(lastUpdatedDate)
      : "";
  }

  STATUS_DOC.onSnapshot((doc) => {
    if (doc.exists) {
      render(doc.data());
    } else {
      label.textContent = "Status indisponível";
    }
  }, (err) => {
    console.error(err);
    label.textContent = "Erro ao carregar status";
  });

  setInterval(tickUpdated, 30000);
</script>

</body>
</html>
